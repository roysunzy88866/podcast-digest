<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索</title><link rel="stylesheet" href="style.css?v=41"><script src="search.js" defer></script></head><body>
<header class="top"><div class="topin">
<a class="b" href="index.html">跨国深谈</a>
<nav class="mainnav"><a href="index.html">最新</a><a href="must-read.html">最热</a></nav>
<a class="mtitle" href="index.html">←<span>搜索</span></a><div class="acts"><button class="ico deskonly" onclick="openSearch()" title="搜索"><svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg></button><button class="ico deskonly" title="深浅色"><svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5v13a6.5 6.5 0 0 0 0-13z" fill="currentColor" stroke="none"/></svg></button>
<button class="ico mobonly" onclick="document.getElementById('mm').classList.add('open')" title="菜单"><svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg></button></div>
</div></header>
<div class="mmenu" id="mm">
  <div class="mmhead"><span class="b">跨国深谈</span><button class="ico" onclick="document.getElementById('mm').classList.remove('open')">✕</button></div>
  <input class="mmsearch" id="mmq" placeholder="搜标题 / 金句 / 正文 / 人名">
  <div id="mmres"></div>
  <div class="mmsec">浏览</div><div class="mmnav" id="mmnav"></div>
  <div class="mmsec">主题</div><div class="mmcat" id="mmcat"></div>
</div>
<div class="skrim" id="sk" onclick="if(event.target===this)this.style.display='none'">
  <div class="sbox"><input id="sq" placeholder="搜标题 / 金句 / 正文 / 人名">
  <div id="sres"></div>
  <div class="shist"><span>试试</span><b>智能体</b><b>护城河</b><b>Anthropic</b><b>增长</b></div></div>
</div>
<div class="shell two"><div class="left"><div class="sh">全部主题</div><a class="cl" href="cat-1.html"><span>创业与行业</span><i>13</i></a><a class="cl" href="cat-6.html"><span>产品方法</span><i>10</i></a><a class="cl" href="cat-2.html"><span>组织与领导力</span><i>9</i></a><a class="cl" href="cat-4.html"><span>智能体</span><i>9</i></a><a class="cl" href="cat-3.html"><span>职业与个人成长</span><i>8</i></a><a class="cl" href="cat-ai.html"><span>AI 编程</span><i>7</i></a><a class="cl" href="cat-7.html"><span>增长与销售</span><i>4</i></a><a class="cl" href="cat-ai.html"><span>AI 安全</span><i>3</i></a>
<div class="about"><a class="back" href="index.html">← 回首页</a></div></div>
<div class="mid">
<div class="hero"><h1>搜索</h1><p>搜标题、金句、正文与人名 —— 全站 40 集中文精华的全文检索。</p></div>
<div class="sbig"><input id="qq" placeholder="试试:智能体 / 增长 / Anthropic / 护城河" autofocus></div>
<div class="frow" id="scope"><span class="k">只看</span>
<button class="fx on" data-g="">全部</button><button class="fx" data-g="标题">标题</button>
<button class="fx" data-g="金句">金句</button><button class="fx" data-g="人名">人名</button>
<button class="fx" data-g="正文">正文</button></div>
<div id="res"></div></div></div>
<script>
function openSearch(){const k=document.getElementById('sk');k.style.display='flex';
  loadIdx().then(()=>{const i=document.getElementById('sq');i.focus();i.oninput=drawS;});}
function drawS(){const i=document.getElementById('sq'),r=document.getElementById('sres');
  const {n,groups}=runSearch(i.value);
  if(!i.value.trim()){r.innerHTML='';return}
  if(!n){r.innerHTML='<div class="sg">没有匹配</div>';return}
  let h='',c=0;
  for(const [g,items] of groups){ h+='<div class="sg">'+g+'</div>';
    for(const x of items){ if(c++>=6) break;
      h+='<a class="si" href="ep-'+x.e.id+'.html"><div class="a">'+(g==='标题'?x.s:x.e.t)+'</div>'+
         (g!=='标题'?'<div class="b">'+x.s+'</div>':'<div class="b">'+x.e.p+'</div>')+'</a>'; } }
  h+='<a class="more" href="search.html?q='+encodeURIComponent(i.value)+'">查看全部 '+n+' 条结果 →</a>';
  r.innerHTML=h; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){const k=document.getElementById('sk'); if(k)k.style.display='none';}
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='sq'){
    location.href='search.html?q='+encodeURIComponent(document.activeElement.value);} });
document.querySelectorAll('.shist b').forEach(b=>b.onclick=()=>{const i=document.getElementById('sq');i.value=b.textContent;drawS();});

// ── 手机端:从左栏/右栏克隆内容,填进大字下拉与全屏菜单(始终与桌面同源,不会漂移)──
(function(){
  const L=document.querySelector('.shell .left'), mdm=document.getElementById('mdm'),
        mdl=document.getElementById('mdl'), mmnav=document.getElementById('mmnav'), mmcat=document.getElementById('mmcat');
  // 视图切换(最新/最热)在手机上从顶栏 nav 取 —— 顶栏在窄屏是隐藏的,视图得有地方去
  if(mdm){
    const cur=(location.pathname.split('/').pop()||'index.html');
    [['index.html','最新'],['must-read.html','最热']].forEach(([h,t])=>{
      const c=document.createElement('a'); c.href=h; c.textContent=t;
      if(h===cur){c.classList.add('on'); if(mdl) mdl.textContent=t;}
      mdm.appendChild(c);
    });
    if(mdl && !mdm.querySelector('.on')) mdl.textContent='最新';
  }
  if(mmnav) mmnav.innerHTML='<a href="index.html">最新</a><a href="must-read.html">最热</a>';
  if(mmcat){
    const src=L?[...L.querySelectorAll('.cl')]:[];
    if(src.length){
      mmcat.innerHTML=src.map(a=>'<a href="'+(a.getAttribute('href')||'#')+'">'+
        (a.querySelector('span')?a.querySelector('span').textContent:a.textContent).trim()+
        '<i>'+(a.querySelector('i')?a.querySelector('i').textContent:'')+'</i></a>').join('');
    } else {
      mmcat.innerHTML=[['创业与行业','cat-1.html',13],['产品方法','cat-6.html',10],['组织与领导力','cat-2.html',9],
        ['智能体','cat-4.html',9],['职业与个人成长','cat-3.html',8],['AI 编程','cat-ai.html',7],
        ['增长与销售','cat-7.html',4],['AI 安全','cat-ai.html',3]]
        .map(x=>'<a href="'+x[1]+'">'+x[0]+'<i>'+x[2]+'</i></a>').join('');
    }
  }
  const q=document.getElementById('mmq');
  if(q) q.addEventListener('focus',()=>loadIdx(),{once:true});
  if(q) q.addEventListener('input',()=>{
    const r=document.getElementById('mmres'); if(!IDX){loadIdx().then(()=>q.dispatchEvent(new Event('input')));return}
    const {n,groups}=runSearch(q.value);
    if(!q.value.trim()){r.innerHTML='';return}
    if(!n){r.innerHTML='<div class="sg">没有匹配</div>';return}
    let h='',c=0;
    for(const [g,items] of groups){h+='<div class="sg">'+g+'</div>';
      for(const x of items){ if(c++>=5) break;
        h+='<a class="si" href="ep-'+x.e.id+'.html"><div class="a">'+(g==='标题'?x.s:x.e.t)+'</div>'+
           (g!=='标题'?'<div class="b">'+x.s+'</div>':'')+'</a>';}}
    h+='<a class="more" href="search.html?q='+encodeURIComponent(q.value)+'">查看全部 '+n+' 条 →</a>';
    r.innerHTML=h;});
  document.addEventListener('click',e=>{const m=document.getElementById('mdm');
    if(m&&m.classList.contains('open')&&!e.target.closest('.mdrop')) m.classList.remove('open');});
})();

document.querySelectorAll('[data-go]').forEach(el=>{
 el.style.cursor='pointer';
 el.addEventListener('click',ev=>{ if(ev.target.closest('a')) return; location.href=el.dataset.go; });
});
document.querySelectorAll('.ts').forEach(b=>b.onclick=()=>{
 let n=b.nextElementSibling;
 if(n&&n.classList.contains('orig')){n.remove();return}
 const d=document.createElement('div');d.className='orig';
 d.innerHTML='<b>英文原话 '+(b.dataset.t||'')+(b.dataset.who?' · '+b.dataset.who:'')+'</b><br>'+(b.dataset.en||'“…original English transcript segment…”')+
 '<br><span style="font-size:11px;color:#b0a3a1">↑ 就地展开,不跳走。数据来自 transcript.en.json</span>';
 b.after(d);
});
</script><script src="search.js"></script><script>
const q=document.getElementById('qq'),res=document.getElementById('res');let G='';
function card(x,g){return `<div class="row" data-go="ep-${x.e.id}.html"><div class="tx">
 <div class="t">${g==='标题'?x.s:x.e.t}</div>
 ${g!=='标题'?`<div class="q">${g==='金句'?'「'+x.s+'」':x.s}</div>`:''}
 <div class="m"><b class="gtag">${g}</b>${x.sub?'<span>'+x.sub+'</span>':''}<span>${x.e.p}</span><span>${x.e.dt}</span></div>
</div></div>`}
function render(){const {n,groups}=runSearch(q.value);
 if(!q.value.trim()){res.innerHTML='<p class="empty">输入关键词开始检索。</p>';return}
 if(!n){res.innerHTML='<p class="empty">没有找到「'+q.value+'」。换个词试试?</p>';return}
 let h='<div class="cnt2">找到 <b>'+n+'</b> 条结果</div>';
 for(const [g,items] of groups){ if(G&&G!==g) continue;
   h+='<div class="gsec">'+g+' · '+items.length+'</div><div class="list">'+items.map(x=>card(x,g)).join('')+'</div>';}
 res.innerHTML=h;
 res.querySelectorAll('[data-go]').forEach(el=>{el.style.cursor='pointer';
   el.onclick=ev=>{if(ev.target.closest('a'))return;location.href=el.dataset.go}});
}
document.querySelectorAll('#scope .fx').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#scope .fx').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');G=b.dataset.g;render()});
loadIdx().then(()=>{const u=new URLSearchParams(location.search).get('q');if(u){q.value=u}render()});
q.addEventListener('input',render);
</script><script src="comment.js?v=4"></script><script>(function(){function s(){var t=document.querySelector('.top');
var sticky=t&&getComputedStyle(t).position==='sticky';document.documentElement.style.setProperty('--stick',(sticky?t.offsetHeight:0)+'px');}
s();addEventListener('resize',s);})();</script></body></html>
