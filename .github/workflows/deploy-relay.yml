name: 部署 feed-relay Worker(手动)

# 断更传输通道(drift #55):CF 边缘代抓被 Substack 按 IP 喂陈旧的 feed。
# 手动触发部署;凭证走仓库 secret(本机无 CF 凭证,不接触明文)。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler@latest 要 Node ≥22
      - name: wrangler deploy
        working-directory: workers/feed-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ac6b3134d98758210ac27d37bd7d5a2d
        run: npx --yes wrangler@latest deploy
