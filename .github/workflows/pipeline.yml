# C7b 无人值守 · 全自动发布流水线(Scenario 3 · ADR 0011/0012 · drift #20/#21/#22)
# cron 一天一次(+手动)→ 取 RSS → 只向前看的新访谈集跑完整链 → gate-all 全过 → 部署 talk.solomind.cc → 去重状态 commit 回仓。
#
# 【全自动例外】发布无人工复核,靠 gate-all(五层机器闸门)+ 定点重写兜底(drift #20,用户知情风险自担)。
# 【安全】只有「真处理了新集 且 gate-all 全过」才 deploy;无新集/闸门不过 → 不碰线上(保上一版)。
#         当前 cutoff 之下无新集时,手动触发会干净退出、不部署 —— 可安全验骨架。
name: C7b Auto Pipeline

on:
  schedule:
    # 每天 4 巡。**C31(2026-08-19 用户拍板「早上起来就有」)起按北京时间排班**:
    #   北京 00:30 / 06:00 / 12:00 / 18:00 = UTC 16:30 / 22:00 / 04:00 / 10:00。
    # 为什么是这四个点:每日目标按北京日算(bjDay),北京 00:30 那班在新一天刚开始就把当天的量补上,
    #   06:00 那班兜底(长跑/排队时的第二次机会)→ 用户 08:00 起床看站,当天内容已备好。
    #   旧排班(北京 10:00 起)+ UTC 切日,导致清晨看站时「今天」恒空 —— 正是用户反复报的「没更新」。
    # 覆盖美国源发布窗口(a16z ~10:00 UTC、Lenny's ~13:30 UTC、Megaphone 系 09-19 UTC):
    #   UTC 22:00 与次日 04:00 两班夹住该窗口,新集最迟 ~6h 被抓,与旧排班同量级。
    # 无新集的巡只花 ~3 分钟装机即退(免费);并发组串行,撞上长跑自动排队(pending 位只 1 个,连发会顶掉——排队靠人时序别靠它)。
    # C23:补历史顶量(--daily-topup)四班全开;topup 幂等(当天已入库 ≥8 就跳),后面的班自动让。
    - cron: "30 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:        # 手动触发(验骨架 / 需要时手动补跑)
    inputs:
      backfill:
        description: "一次性回填最近 N 集(评估批,override 只向前看;留空/0=正常只向前看)"
        required: false
        default: "0"
      deploy:
        description: "强制部署当前已发布集(即便本轮无新集)——用于把已提交的干净集重新上线"
        required: false
        default: "false"
      refresh:
        description: "存量回刷:按 C15 新浓缩规范重刷已发布集(all=全部,或逗号分隔集 id)。翻译/转写缓存复用、实体嘉宾不重抽;已合规集自动跳过(断点续跑,中途挂了直接重跑同参数);过不了闸门自动回滚老版。只在显式传入时走,cron 不受影响"
        required: false
        default: ""
      source:
        description: "只跑指定源(如 a16z;多源下 backfill 必填,防笼统批量烧钱——C9)"
        required: false
        default: ""
      seed:
        description: "true=给缺基线的源设 cutoff(只补缺,绝不顶已有;配 source 可只 seed 一个源)——C10,本机 fetch 不走代理故 seed 放云端"
        required: false
        default: "false"
      talks:
        description: "true=演讲精选批次(C16/ADR 0017):只处理 data/talks-seed 种子。C17/ADR 0018.5 起 cron 例行班次发现待处理种子会自动带上 talks 源,此入口保留给人工圈选批次/立即补跑"
        required: false
        default: "false"
      talks_cap:
        description: "每班演讲种子上限覆写(2026-07-31 保险丝:默认 3 写死在代码里,防几十条种子挤一班撞 runner 6h 上限;人工批次想多吃在这里显式调大,超出的种子留后班)"
        required: false
        default: ""

permissions:
  contents: write           # 处理完把新集 data/ + pipeline-state.json commit 回仓(去重状态持久化)

concurrency:
  group: c7b-pipeline
  cancel-in-progress: false # 别打断正在发布的跑批

jobs:
  run:
    runs-on: ubuntu-latest
    # C32:显式 5.5h(平台硬上限 6h)。作业内部另有 JOB_BUDGET_MIN=300 分的软预算先停手,
    # 这里是第二道:万一软预算算漏,也让作业早于平台 30 分钟结束,回仓步骤仍有机会跑。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # drift #44:checkout 检出的是 github.sha = run **创建时刻**钉死的 main 快照,不是执行时刻的分支尖。
      # 并发组里排队几小时的 run,开始执行时前一班的回仓 push(cutoff/skipped 账本 + 产物)不在它的检出里
      # → 拿旧账本判「种子待处理/集未完成」,把已完成的活重做(run 30624243940 实账:双烧两条演讲的转写+浓缩,
      # 叠加新集撞 6h runner 上限被杀)。修:开工第一步强制刷到 origin/main 最新,消灭「排队期快照过旧」窗口。
      # · 单 job 单 checkout,cron/dispatch(backfill/refresh/talks/seed/deploy)全入口共用 → 一处加步全覆盖
      # · 凭证:checkout@v4 默认 persist-credentials=true,fetch 用它;文末回仓步 pull+push 同源已多班实证
      # · 与回仓步口径一致:那边 pull --rebase 也是先取 origin/main;这里开工时本地无新提交,reset --hard 等价且更干净
      # · fetch 失败响亮挂掉(默认 shell 带 -e):宁可本班不跑等下一巡,不拿旧账本重烧钱
      # · main-only 假设(GLM 20260801-001[1]):触发只有 schedule/dispatch,且回仓步本就写死 pull origin main;
      #   若未来从非 main ref dispatch,此步会切到 main——与既有回仓假设同款,不是本步新增的行为
      - name: "刷新到 origin/main 最新(drift #44:堵排队旧快照重烧钱洞)"
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "开工基线:$(git log --oneline -1)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      # C9:whisperx 要 3.11(spike 同款);edge-tts 纯 python,跟着 3.11 也没事
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 与 deploy-site.yml 同一手法:音频是 gitignore 的产物,不缓存就每次重念全库。
      # 合成逻辑本来就只补「缺音频的集」,缓存命中后自然只念新集。
      - name: 取回音频缓存(省掉重复合成)
        uses: actions/cache@v4
        with:
          path: |
            data/episodes/*/audio.mp3
            data/episodes/*/audio.meta.json
          # v2:C15 刀①(音频只读 digest_md)后旧口径音频指纹全作废,v1 缓存无复用价值;
          # 且 digest 未变时 v1 会 exact-hit → 回存被跳过 → 每轮全库重念。换代一次性重合成后回到正常命中。
          key: audio-v2-${{ hashFiles('data/episodes/*/digest.json') }}
          restore-keys: |
            audio-v2-

      - name: 装环境(ffmpeg + edge-tts + glm-ask + whisperX + node deps)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --user edge-tts
          # C9 · a16z ASR 进料口:whisperX(CPU 版 torch 免 CUDA 大包)。每 run 都装(~3 分钟):
          # 装不装取决于本轮有没有 a16z 新集,但那要跑了编排器才知道 → 无条件装,公开仓 runner 分钟免费。
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q whisperx
          echo "EDGE_TTS_BIN=$HOME/.local/bin/edge-tts" >> "$GITHUB_ENV"
          # 装 glm-ask 到 PATH:流水线脚本都调裸命令 glm-ask,runner 上没有 → 用仓库自带副本(key 走 ZHIPU_API_KEY env)
          mkdir -p "$HOME/.local/bin"
          cp tools/glm-ask "$HOME/.local/bin/glm-ask"
          chmod +x "$HOME/.local/bin/glm-ask"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --no-audit --no-fund

      - name: 跑编排器(取 RSS → 新集跑全链 → gate-all 全过才成)
        id: pipeline
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # C9:whisperX pyannote 分离要(a16z ASR 路线)
          # C30:消费中转站音频后 gh release delete-asset 清 asset(公开仓下载免认证;删除要 token,contents 权限已够)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 2026-07-31 保险丝:每班演讲种子上限覆写(空=用代码写死的默认 3)。cron 与人工 talks 批次同受限。
          TALKS_BATCH_CAP: ${{ github.event.inputs.talks_cap || '' }}
        run: |
          # 手动触发可传 backfill=N 回填最近 N 集(评估批);cron/默认走正常「只向前看」
          BACKFILL="${{ github.event.inputs.backfill || '0' }}"
          REFRESH="${{ github.event.inputs.refresh || '' }}"
          SOURCE="${{ github.event.inputs.source || '' }}"
          # 非法输入(非数字)响亮报错,不静默降级为只向前看(GLM 20260720-004[1])
          if ! echo "$BACKFILL" | grep -qE '^[0-9]+$'; then
            echo "::error::backfill 输入非法(需非负整数):'$BACKFILL'"; exit 1
          fi
          # C9:source 只许简单 slug(照 backfill 校验先例);编排器还会核对 SOURCES 名单
          if [ -n "$SOURCE" ] && ! echo "$SOURCE" | grep -qE '^[a-z0-9]+$'; then
            echo "::error::source 输入非法(需小写字母数字 slug):'$SOURCE'"; exit 1
          fi
          # 2026-07-31 保险丝:talks_cap 覆写需正整数(照 backfill 校验先例;代码里 resolveTalksCap 还会兜一道)
          if [ -n "$TALKS_BATCH_CAP" ] && ! echo "$TALKS_BATCH_CAP" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::talks_cap 输入非法(需正整数):'$TALKS_BATCH_CAP'"; exit 1
          fi
          SRC_ARGS=""
          [ -n "$SOURCE" ] && SRC_ARGS="--source $SOURCE"
          # C10:seed 模式(设基线不处理内容,不烧钱)。放云端因本机 Node fetch 不走代理、部分 feed 取不到。
          if [ "${{ github.event.inputs.seed || 'false' }}" = "true" ]; then
            echo "🌱 seed 模式:补缺基线 ${SOURCE:+(只 $SOURCE)}"
            node scripts/run-pipeline.mjs --seed $SRC_ARGS
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 部署解耦(drift #68 · [standard-change: 用户授权 2026-08-18]):编排器成败不再决定
          # 「做完的干净集能不能上站」。子 shell 跑编排器、记下退出码;has_new 判定**无论成败都算**;
          # 步骤最后仍按原退出码退出(run 该红还红、告警照发)——只是下游部署步不再被拖死。
          # 血账:08-14 起反复出现「内容做完躺仓库、站上没有」,3 集 Beyond Coding 做完 10 小时无人送最后一公里。
          # ⚠️ 别写成 `( set -e … ) || PIPE_RC=$?` —— bash 规定:命令出现在 `||` 左侧时 errexit **一律失效**,
          # 于是子 shell 里非最后一条命令挂了会被静默跳过、PIPE_RC 拿到的是最后一条的码(实测 refresh 分支
          # 9 条串行命令,第一条挂后面照跑、run 还绿 → 告警永不发)。必须让子 shell 作为**独立命令**执行,
          # 用 set +e 关掉外层 errexit、再用 $? 取码(独立审计 2026-08-18 逮到,是我引入的)。
          PIPE_RC=0
          set +e
          (
          set -e
          # C16:演讲精选批次(--talks 只跑 talks 源;音频从 Release asset 公开直链拉,无新拉取步)
          # C17/ADR 0018.5:cron 默认分支(最下面的 run-pipeline 裸跑)遇到待处理种子会自动带上 talks 源,此入口只为人工批次保留
          if [ "${{ github.event.inputs.talks || 'false' }}" = "true" ]; then
            echo "🎤 演讲精选批次:处理 data/talks-seed 种子"
            node scripts/run-pipeline.mjs --talks
          elif [ -n "$REFRESH" ]; then
            # 输入防呆(照 backfill 数字校验先例;GLM 20260724-002[2]):只许 all 或集 id 逗号串
            if ! echo "$REFRESH" | grep -qE '^(all|[a-zA-Z0-9,_-]+)$'; then
              echo "::error::refresh 输入非法(需 all 或逗号分隔集 id):'$REFRESH'"; exit 1
            fi
            # 存量翻新(2026-07-24 用户拍板:云端真实流程做):重浓缩→闸门→败者回滚老版 → 统一重建+全库门
            echo "🔄 存量翻新模式:$REFRESH"
            if [ "$REFRESH" = "all" ]; then node scripts/refresh-digests.mjs; else node scripts/refresh-digests.mjs --ids "$REFRESH"; fi
            node scripts/run-pipeline.mjs --ensure-audio   # 回滚集在 runner 无音频,gate-audio 会挂(refresh 首跑 18 条实测)
            node scripts/build-entities.mjs
            node scripts/build-pages.mjs
            node scripts/build-list.mjs
            node scripts/build-tag-pages.mjs
            node scripts/build-mustread.mjs
            node scripts/build-feed.mjs --out feed.xml
            node scripts/gate-all.mjs
          elif [ "$BACKFILL" -gt 0 ]; then
            echo "🔁 回填模式:最近 $BACKFILL 集 ${SOURCE:+(源 $SOURCE)}"
            # 多源配置下编排器强制回填必须点名源(C9 防呆);不点名会响亮 exit 2
            node scripts/run-pipeline.mjs --backfill "$BACKFILL" $SRC_ARGS
          else
            # C23:补历史顶量四班全开(2026-08-18 用户拍板;topup 幂等,当天已入库 ≥ 目标就跳,手动 dispatch 不补)。
            # 四班全开顶量(2026-08-18 用户拍板·standard-change,原只 14/22 两晚班):便宜通道后补集
            # 成本掉到分钟级 → 白天也产内容(用户「白天你有跑的逻辑吗」)。topup 幂等:当天够 8 就跳。
            TOPUP=""
            [ -n "${{ github.event.schedule }}" ] && TOPUP="--daily-topup"
            node scripts/run-pipeline.mjs $SRC_ARGS $TOPUP
          fi
          )
          PIPE_RC=$?
          set -e
          # 判定是否有**干净可发**的新内容:只看 data/episodes(新完成集)+ samples(新集页)——
          # 全被隔离时 data/episodes 无新增(失真集已移去 gitignore 的 data/skipped),samples 也无新增 → 不部署。
          # (不看 pipeline-state.json:它在"全 skip 只更新账本"时也会变,会误判有新)
          if [ -n "$(git status --porcelain data/episodes samples)" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "有新集页,待过闸门再定部署"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "无干净新集(无新/全隔离),跳过部署(线上保持上一版)"
          fi
          # ⚠️ 部署前**独立再过一次闸门**(独立审计 2026-08-18 逮到的降级,是我引入的):
          # run-pipeline 的顺序是「先 rebuildAll() 把集页写进 samples/,再跑 gate-all」——
          # 闸门挂掉时 samples/ 已经脏了 → has_new=true;而 deploy-site.sh 自己不跑 gate-all
          # → 解耦前 bash -e 会中止整步(算不出 has_new)所以侥幸不部署,解耦后就把**没过闸的内容送上线**。
          # 这里不依赖编排器怎么退出的,自己再判一次:全过才允许部署。gate-all 是本地校验,几秒钟。
          GATE_OK=false
          if node scripts/gate-all.mjs; then GATE_OK=true; else echo "::warning::闸门未过 → 本轮不部署(线上保持上一版)"; fi
          echo "gate_ok=$GATE_OK" >> "$GITHUB_OUTPUT"
          # 编排器的失败该红还红(告警照发),但 has_new/gate_ok 已经写出、部署步靠 !cancelled() 照常判
          exit $PIPE_RC

      - name: 产物兜底 artifact(无论成败:回仓再败也能手动捞,付费产物永不随 runner 销毁)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-products-${{ github.run_id }}
          path: |
            data/episodes/
            data/skipped/
            data/pipeline-state.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 构建站点 + 部署 talk.solomind.cc(有干净集就上站,不被整轮成败绑架)
        # drift #68 · [standard-change: 用户授权 2026-08-18]:原条件隐含 success() → 单源失败/超时
        # 都会把做完的干净集扣在仓库里(08-14 已记账,拖到用户连问三天「怎么没更新」)。
        # !cancelled() = 编排器失败(如单源抓挂)也照样部署已做完的集;被取消的 run 除外(runner 已被杀)。
        # ⚠️ 上一版这里写「没过闸的集本来就进不了 samples」——**错的**:run-pipeline 是先 rebuildAll()
        # 写 samples/、再跑 gate-all,闸门挂时 samples/ 已经脏了。改由 gate_ok 独立把关(见上)。
        # 被取消的 run 例外(runner 已被杀,跑不了)。
        # gate_ok 是部署前独立重跑的闸门结论(不信编排器的退出码)——闸门没过一律不上线,
        # 手动 deploy=true 也不能绕(独立审计 2026-08-18:原写法会把没过闸的集送上线)。
        if: ${{ !cancelled() && steps.pipeline.outputs.gate_ok == 'true' && (steps.pipeline.outputs.has_new == 'true' || github.event.inputs.deploy == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # account id 是标识符非机密(单独无用),直接写死省得多配一个 secret
          CLOUDFLARE_ACCOUNT_ID: ac6b3134d98758210ac27d37bd7d5a2d
        # 部署真相已抽到 scripts/deploy-site.sh(2026-07-25):deploy-site.yml 独立通道也调这一份,
        # 两处同一真相不漂移。改部署逻辑请只改那个脚本。
        run: bash scripts/deploy-site.sh

      - name: 去重状态 commit 回仓(始终:持久化 cutoff + skipped 账本,防下次重跑重扣钱)
        if: always()
        run: |
          git config user.name "c7b-bot"
          git config user.email "c7b-bot@users.noreply.github.com"
          # data/skipped 是 gitignore 的(不入公开仓);去重靠 pipeline-state.json 的 skipped 账本
          git add data/episodes data/pipeline-state.json samples 2>/dev/null || true
          git commit -m "[C7 🤖] C7b 自动跑批:推进 cutoff + skipped 账本(+干净集若有) (US-4, US-5)" || { echo "无改动可提交"; exit 0; }
          # commit 后清场:add 只收产物三路径,其余 tracked 文件的运行期改动(如 npm install 动 lockfile)
          # 会以 unstaged 状态阻塞 pull --rebase(run 30058134004 实测连败 3 次丢第二批产物的根因)。
          # 产物已全在 commit 里 → reset --hard 只丢「不该回仓的运行期垃圾」,安全。
          git reset --hard HEAD
          # ⚠️ push 失败绝不静默(drift #32 血账:跑批 2h 期间远端被推了 docs → push rejected 被
          #    `|| echo` 吞掉 → 十几集付费产物随 runner 销毁)。修:先 rebase 远端再推,重试 3 次,
          #    仍败响亮 exit 1(产物在丢失边缘,必须人立刻看)。产物路径与 docs/代码天然不相交,rebase 必顺。
          ok=""
          for i in 1 2 3; do
            # -X theirs:产物文件冲突自动取本 run 版(rebase 中 theirs=正在 apply 的 run 产物提交)。
            # run 30073308605 实测:5h 长跑期间 cron 插队回仓 → samples 冲突 → 裸 rebase 三连败丢第三批产物。
            # 产物=确定性重算可再生,run 版最新最全 → 自动取之安全;真代码冲突不会出现在回仓(回仓只提交产物路径)。
            if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true   # rebase 半途失败会留 in-progress 态,不清掉重试必撞(GLM 20260724-001[2])
            echo "回仓 push 第 $i 次失败,5s 后重试"; sleep 5
          done
          [ -n "$ok" ] || { echo "::error::回仓 push 连败 3 次——本批付费产物将随 runner 销毁!立刻人工介入(重跑或手动捞产物)"; exit 1; }

      - name: 发布小结(写进 job summary)
        if: always()
        run: |
          {
            echo "## C7b 跑批结果"
            echo "- 有新集:\`${{ steps.pipeline.outputs.has_new }}\`"
            echo "- 有新集→已部署 talk.solomind.cc 并 commit 回仓;无新集→未碰线上。"
            echo "- 失败时 GitHub 会自动给仓库 owner 发邮件(原生告警)。"
          } >> "$GITHUB_STEP_SUMMARY"
