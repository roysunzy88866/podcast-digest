# 独立部署通道(2026-07-25 用户拍板)—— 只重建+部署站点,不碰内容。
#
# 解决什么问题:pipeline.yml 的并发组 c7b-pipeline 串行排队,长跑的内容处理(ASR 可达 60-77 分钟)
# 会把「只想上线一个视觉改动」堵死。本工作流用**独立并发组**,不跟内容任务抢队。
#
# 安全边界:
#   · 只跑 scripts/deploy-site.sh(与 pipeline.yml 部署步同一份真相,不会漂移)
#   · **不取 RSS、不处理新集、不动 data/、不 commit 回仓** —— 纯粹重建已发布内容并推上线
#   · 部署前的硬断言(Bases 卡片真渲染 / feed 有 enclosure)都在脚本里,照旧生效
name: 部署站点(独立通道)

on:
  workflow_dispatch: # 只手动触发,不定时(定时上线归 pipeline.yml)

concurrency:
  group: deploy-site-only # ← 与 c7b-pipeline 不同组:内容任务在跑也不排队
  cancel-in-progress: false

permissions:
  contents: read # 只读:本通道不回写仓库

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0" # 对齐 pipeline.yml 与 Quartz .node-version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # edge-tts 要(补已发布集缺的音频)

      # 部署慢的根子:audio.mp3 是 gitignore 的产物,每次都是空白机器 →
      # 40 集全部重念一遍(实测 25 分钟里约 20 分钟花在这)。哪怕只改了几行 CSS。
      # 用 Actions 自带缓存把音频存下来:deploy-site.sh 本来就只给「缺音频的集」合成,
      # 所以缓存命中后它自然只念新集。
      # key 里带 digest 的哈希 → 某集内容变了就换 key;restore-keys 前缀回退让老音频仍能复用。
      - name: 取回音频缓存(省掉重复合成)
        uses: actions/cache@v4
        with:
          path: |
            data/episodes/*/audio.mp3
            data/episodes/*/audio.meta.json
          key: audio-v1-${{ hashFiles('data/episodes/*/digest.json') }}
          restore-keys: |
            audio-v1-

      - name: 装环境(ffmpeg + edge-tts + node deps)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m venv .venv
          .venv/bin/pip install --quiet edge-tts
          npm install --no-audit --no-fund

      - name: 构建 + 部署 talk.solomind.cc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # account id 是标识符非机密(单独无用),与 pipeline.yml 一致直接写死
          CLOUDFLARE_ACCOUNT_ID: ac6b3134d98758210ac27d37bd7d5a2d
        run: bash scripts/deploy-site.sh
